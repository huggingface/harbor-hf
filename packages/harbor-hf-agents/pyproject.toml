[project]
name = "harbor-hf-agents"
version = "0.1.0"
description = "Harbor command-agent plugin and temporary ATIF converters for Harbor-HF."
requires-python = ">=3.12"
dependencies = [
  "harbor[hf-sandbox] @ git+https://github.com/harbor-framework/harbor.git@dcd0a7ac74b7bd417780d9cb27cd819c7ec82e4e",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.16.3",
  "ty==0.0.59",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
