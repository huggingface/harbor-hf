name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: python3 scripts/check_public_privacy.py .
        env:
          PUBLIC_PRIVACY_DENYLIST: ${{ secrets.PUBLIC_PRIVACY_DENYLIST }}
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest --cov=src/harbor_hf --cov-fail-under=85
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:generated
      - run: npm audit --audit-level=low
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: docker build --platform linux/amd64 -f deploy/control-space/Dockerfile .
      - run: docker build --platform linux/amd64 -f deploy/parent-worker/Dockerfile .
      - run: uv run slophammer-py dry .
      - run: uv run pip-audit
      - run: uv run slophammer-py check .
      - run: python3 packages/harbor-hf-agents/sdk-backport/build.py
      - run: uv sync --all-groups --locked
        working-directory: packages/harbor-hf-agents
      - run: uv run ruff check .
        working-directory: packages/harbor-hf-agents
      - run: uv run ruff format --check .
        working-directory: packages/harbor-hf-agents
      - run: uv run ty check
        working-directory: packages/harbor-hf-agents
      - run: uv run pytest
        working-directory: packages/harbor-hf-agents
