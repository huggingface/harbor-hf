name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: python3 scripts/check_public_privacy.py .
        env:
          PUBLIC_PRIVACY_DENYLIST: ${{ secrets.PUBLIC_PRIVACY_DENYLIST }}
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest --cov=src/harbor_hf --cov-fail-under=85
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:generated
      - run: npm audit --audit-level=low
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: docker build --platform linux/amd64 -f deploy/control-space/Dockerfile .
      - run: uv run slophammer-py dry .
      - run: uv run pip-audit
      - run: uv run slophammer-py check .
      - run: uv sync --all-groups --locked
        working-directory: packages/harbor-hf-agents
      - run: uv run ruff check .
        working-directory: packages/harbor-hf-agents
      - run: uv run ruff format --check .
        working-directory: packages/harbor-hf-agents
      - run: uv run ty check
        working-directory: packages/harbor-hf-agents
      - run: uv run pytest
        working-directory: packages/harbor-hf-agents
