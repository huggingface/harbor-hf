name: Mutation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --all-groups --locked
      - run: uv run python scripts/check_mutation.py --min-kill-rate 90
      - run: uv sync --all-groups --locked
        working-directory: packages/harbor-hf-agents
      - run: uv run python ../../scripts/check_mutation.py --repository . --min-kill-rate 90
        working-directory: packages/harbor-hf-agents
