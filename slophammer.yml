python:
  coverage:
    threshold: 85
    paths:
      - src/harbor_hf
  complexity:
    max: 8
  dry:
    max_findings: 0
    paths:
      - src/harbor_hf
      - packages/harbor-hf-agents/src/harbor_hf_agents
    copied_blocks:
      enabled: true
      min_tokens: 100
  dependency_boundaries:
    - from: src/harbor_hf
      allow: []
    - from: packages/harbor-hf-agents/src/harbor_hf_agents
      allow: []
